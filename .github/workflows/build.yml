name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - 'master' 
    paths:
      - '**.hpp'
      - '**.cpp'
      - '**.h'
      - '**.c'
      - '**CMakeLists.txt'
      - '.github/workflows/build.yml'
  pull_request:
    branches:
      - 'master'
    paths:
      - '**.hpp'
      - '**.cpp'
      - '**.h'
      - '**.c'
      - '**CMakeLists.txt'
      - '.github/workflows/build.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            build-type: Debug
            cmake-args: '-AWin32 -Thost=x86 -DGH_ACBUILD=TRUE -DUSING_BOOST_NO_CONAN=ON -DUSING_OPENSSL_NO_CONAN=ON -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake'
          - os: windows-2022
            build-type: Release
            cmake-args: '-AWin32 -Thost=x86 -DGH_ACBUILD=TRUE -DUSING_BOOST_NO_CONAN=ON -DUSING_OPENSSL_NO_CONAN=ON -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake'
          - os: ubuntu-22.04
            build-type: Debug
            cmake-args: '-DCMAKE_CXX_FLAGS=-m32 -DCMAKE_C_FLAGS=-m32 -DGH_ACBUILD=TRUE'
          - os: ubuntu-22.04
            build-type: Release
            cmake-args: '-DCMAKE_CXX_FLAGS=-m32 -DCMAKE_C_FLAGS=-m32 -DGH_ACBUILD=TRUE'

    runs-on: ${{ matrix.os }}
    env:
      BUILD_TYPE: ${{ matrix.build-type }}
      CMAKE_BUILD_PARALLEL_LEVEL: 2

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: false

    - name: Initialize submodules
      shell: bash
      run: |
        git config --global url."https://github.com/AmyrAhmady/samp-cmake-modules.git".insteadOf "https://github.com/Zeex/cmake-modules.git"
        git submodule sync --recursive
        git submodule update --init --force --depth=1 --recursive

    - name: Set env
      run: echo "REPO_TAG=$(git describe --tags --always)" >> $GITHUB_ENV
      shell: bash
    
    - if: runner.os == 'Linux'
      name: Install gcc/g++-multilib
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt install gcc-multilib g++-multilib

    - name: Get python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - if: runner.os == 'Windows'
      name: Install Windows network dependencies
      run: vcpkg install boost-asio:x86-windows boost-beast:x86-windows boost-lockfree:x86-windows boost-spirit:x86-windows boost-variant:x86-windows openssl:x86-windows

    - if: runner.os == 'Windows'
      name: Provide Conan 1 MSVC toolset compatibility
      shell: pwsh
      run: |
        $toolsetsRoot = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC'
        $currentToolset = Get-ChildItem -LiteralPath $toolsetsRoot -Directory |
          Where-Object Name -NE '14.3' |
          Sort-Object Name -Descending |
          Select-Object -First 1
        if (-not $currentToolset) {
          throw 'No Visual Studio 2022 C++ toolset was found.'
        }
        $compatibilityPath = Join-Path $toolsetsRoot '14.3'
        if (-not (Test-Path -LiteralPath $compatibilityPath)) {
          New-Item -ItemType Junction -Path $compatibilityPath -Target $currentToolset.FullName | Out-Null
        }

    - name: Install conan
      run: |
        python -m pip install --upgrade pip
        pip install "conan<2"

    - name: Generate build files
      run: mkdir build && cd build && cmake .. ${{ matrix.cmake-args }} -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -DDCC_VERSION="${{ env.REPO_TAG }}"

    - if: runner.os == 'Windows'
      name: Build Windows
      run: cd build && cmake --build . --config ${{ matrix.build-type }}

    - if: runner.os == 'Linux'
      name: Build Linux
      run: cd build && cmake --build .
      

    - name: Zip artifact
      run: Compress-Archive ${{ runner.workspace }}/samp-discord-connector/build/artifact/* ${{ runner.workspace }}/samp-discord-connector/build/artifact/discord-connector-${{ env.REPO_TAG }}-${{ runner.os }}-${{ matrix.build-type }}.zip
      shell: pwsh
      
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: discord-connector-${{ env.REPO_TAG }}-${{ runner.os }}-${{ matrix.build-type }}
        path: ${{ runner.workspace }}/samp-discord-connector/build/artifact/discord-connector-${{ env.REPO_TAG }}-${{ runner.os }}-${{ matrix.build-type }}.zip
